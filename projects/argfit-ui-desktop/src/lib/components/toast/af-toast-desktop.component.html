<span class="af-toast-desktop__icon" aria-hidden="true">
  <af-icon [name]="iconName()" [tone]="iconTone()" size="md" decorative />
</span>

<span class="af-toast-desktop__content">
  <span class="af-toast-desktop__title">{{ toast().title }}</span>
  @if (toast().description; as description) {
    <span class="af-toast-desktop__description">{{ description }}</span>
  }
</span>

@if (toast().action; as action) {
  <button
    type="button"
    class="af-toast-desktop__action"
    [attr.aria-label]="action.ariaLabel ?? null"
    (click)="onAction()"
  >
    {{ action.label }}
  </button>
}

<button
  type="button"
  class="af-toast-desktop__close"
  [attr.aria-label]="closeLabel()"
  (click)="onDismiss()"
>
  <af-icon name="x" size="xs" tone="muted" decorative />
</button>
