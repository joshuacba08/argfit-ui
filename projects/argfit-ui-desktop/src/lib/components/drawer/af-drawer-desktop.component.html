@if (open()) {
  <div class="af-drawer-desktop__backdrop" (click)="onBackdropClick($event)" data-af-drawer-backdrop>
    <div
      class="af-drawer-desktop__panel"
      [attr.data-placement]="placement()"
      [attr.data-size]="size()"
      [attr.data-tone]="tone()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="labelledBy()"
      [attr.aria-describedby]="describedBy()"
      afFocusTrap
      [afFocusTrapEnabled]="open()"
      afEscapeKey
      (afEscape)="onEscape($event)"
      tabindex="-1"
    >
      @if (title() || description() || dismissible()) {
        <header class="af-drawer-desktop__header">
          <div class="af-drawer-desktop__heading">
            @if (title(); as titleText) {
              <h2 class="af-drawer-desktop__title" [id]="titleId">{{ titleText }}</h2>
            }
            @if (description(); as descriptionText) {
              <p class="af-drawer-desktop__description" [id]="descriptionId">{{ descriptionText }}</p>
            }
          </div>

          @if (dismissible()) {
            <button
              type="button"
              class="af-drawer-desktop__close"
              [attr.aria-label]="closeLabel()"
              (click)="onCloseButton()"
              afFocusInitial
            >
              <span aria-hidden="true">×</span>
            </button>
          }
        </header>
      }

      <div class="af-drawer-desktop__body">
        <ng-content />
      </div>
    </div>
  </div>
}
