@if (icon(); as iconValue) {
  <af-icon class="af-chip-desktop__icon" [name]="iconValue" size="xs" decorative />
}

<span class="af-chip-desktop__label">
  <ng-content />
</span>

@if (removable()) {
  <button
    type="button"
    class="af-chip-desktop__remove"
    [attr.aria-label]="removeAriaLabel()"
    (click)="onRemove($event)"
  >
    <af-icon name="x" size="xs" tone="muted" decorative />
  </button>
}
