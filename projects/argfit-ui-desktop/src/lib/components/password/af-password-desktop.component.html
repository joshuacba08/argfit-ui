<div class="af-password-desktop__field">
  @if (label(); as labelText) {
    <label class="af-password-desktop__label" [attr.for]="resolvedInputId()">
      {{ labelText }}
      @if (required()) {
        <span class="af-password-desktop__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="af-password-desktop__control">
    @if (disabled()) {
      <input
        class="af-password-desktop__input"
        [id]="resolvedInputId()"
        [type]="passwordVisible() ? 'text' : 'password'"
        [value]="value()"
        [attr.placeholder]="placeholder() ?? null"
        [disabled]="true"
        [readonly]="readonly()"
        [attr.name]="name() ?? null"
        [attr.autocomplete]="resolvedAutocomplete()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-required]="required() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />
    } @else {
      <input
        pPassword
        class="af-password-desktop__input"
        [id]="resolvedInputId()"
        [value]="value()"
        [attr.placeholder]="placeholder() ?? null"
        [readonly]="readonly()"
        [attr.name]="name() ?? null"
        [attr.autocomplete]="resolvedAutocomplete()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-required]="required() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        [feedback]="feedback()"
        [showPassword]="passwordVisible()"
        [promptLabel]="promptLabel()"
        [weakLabel]="weakLabel()"
        [mediumLabel]="mediumLabel()"
        [strongLabel]="strongLabel()"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />
    }

    <button
      type="button"
      class="af-password-desktop__toggle"
      [attr.aria-label]="toggleLabel()"
      [attr.aria-controls]="resolvedInputId()"
      [attr.aria-pressed]="passwordVisible()"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleVisibility()"
    >
      <af-icon [name]="toggleIcon()" size="sm" tone="muted" decorative />
    </button>
  </div>

  @if (error(); as errorText) {
    <p class="af-password-desktop__message af-password-desktop__message--error" [id]="errorId()">
      {{ errorText }}
    </p>
  } @else if (hint(); as hintText) {
    <p class="af-password-desktop__message af-password-desktop__message--hint" [id]="hintId()">
      {{ hintText }}
    </p>
  }
</div>
