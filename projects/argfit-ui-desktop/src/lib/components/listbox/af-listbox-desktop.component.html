<div class="af-listbox-desktop__field">
  @if (label(); as labelText) {
    <p class="af-listbox-desktop__label">
      {{ labelText }}
      @if (required()) {
        <span class="af-listbox-desktop__required" aria-hidden="true">*</span>
      }
    </p>
  }

  <div
    class="af-listbox-desktop__panel"
    [attr.id]="resolvedInputId()"
    role="listbox"
    [attr.aria-multiselectable]="selectionMode() === 'multiple' ? 'true' : null"
    [attr.aria-describedby]="errorText() ? errorId() : helperText() ? hintId() : null"
    [attr.aria-invalid]="errorText() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
  >
    @for (option of options(); track option.key) {
      <button
        type="button"
        class="af-listbox-desktop__option"
        role="option"
        [attr.aria-selected]="option.selected"
        [attr.data-selected]="option.selected ? '' : null"
        [disabled]="isOptionDisabled(option)"
        (click)="onToggle(option)"
        (focus)="onOptionFocus()"
        (blur)="onOptionBlur($event)"
        (keydown)="onOptionKeydown($event, option)"
      >
        <span class="af-listbox-desktop__option-mark" aria-hidden="true">{{ option.selected ? '✓' : selectionMode() === 'multiple' ? '' : '•' }}</span>
        <span class="af-listbox-desktop__option-copy">
          <span class="af-listbox-desktop__option-label">{{ option.label }}</span>
          @if (option.hint; as hintText) {
            <span class="af-listbox-desktop__option-hint">{{ hintText }}</span>
          }
        </span>
      </button>
    } @empty {
      <p class="af-listbox-desktop__empty">{{ emptyText() }}</p>
    }
  </div>

  @if (errorText(); as error) {
    <p class="af-listbox-desktop__message af-listbox-desktop__message--error" [id]="errorId()">{{ error }}</p>
  } @else if (helperText(); as helper) {
    <p class="af-listbox-desktop__message af-listbox-desktop__message--hint" [id]="hintId()">{{ helper }}</p>
  }
</div>
