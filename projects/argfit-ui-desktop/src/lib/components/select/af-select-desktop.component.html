<div class="af-select-desktop__field">
  @if (label(); as labelText) {
    <label class="af-select-desktop__label" [attr.for]="resolvedSelectId()">
      {{ labelText }}
      @if (required()) {
        <span class="af-select-desktop__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="af-select-desktop__control">
    <select
      class="af-select-desktop__select"
      [id]="resolvedSelectId()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.name]="name() ?? null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (change)="onChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    >
      @if (placeholder(); as placeholderText) {
        <option value="" disabled>{{ placeholderText }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</option>
      }
    </select>
  </div>

  @if (error(); as errorText) {
    <p class="af-select-desktop__message af-select-desktop__message--error" [id]="errorId()">
      {{ errorText }}
    </p>
  } @else if (hint(); as hintText) {
    <p class="af-select-desktop__message af-select-desktop__message--hint" [id]="hintId()">
      {{ hintText }}
    </p>
  }
</div>
