<div class="af-select-desktop__field">
  @if (label(); as labelText) {
    <label class="af-select-desktop__label" [attr.for]="resolvedSelectId()" [id]="labelId()">
      {{ labelText }}
      @if (required()) {
        <span class="af-select-desktop__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="af-select-desktop__control">
    <p-select
      class="af-select-desktop__select"
      [inputId]="resolvedSelectId()"
      [ngModel]="value()"
      [ngModelOptions]="{ standalone: true }"
      [options]="selectOptions()"
      optionLabel="label"
      optionValue="value"
      optionDisabled="disabled"
      [placeholder]="placeholder() ?? undefined"
      [disabled]="disabled()"
      [loading]="loading()"
      [filter]="searchable()"
      filterBy="label"
      [filterPlaceholder]="searchPlaceholder()"
      [emptyFilterMessage]="searchEmptyText()"
      [appendTo]="'body'"
      panelStyleClass="af-select-desktop__overlay"
      [ariaLabelledBy]="ariaLabelledBy()"
      [unstyled]="true"
      [pt]="selectPt()"
      (onChange)="onChange($event)"
      (onFocus)="onFocus()"
      (onBlur)="onBlur()"
      (onFilter)="onFilter($event)"
      (onShow)="onShow()"
      (onHide)="onHide()"
    >
      <ng-template #footer>
        @if (loadingMore()) {
          <div class="af-select-desktop__loading-more">
            <span class="af-select-desktop__spinner" aria-hidden="true"></span>
            <span>Cargando más opciones…</span>
          </div>
        }
      </ng-template>
    </p-select>
  </div>

  @if (error(); as errorText) {
    <p class="af-select-desktop__message af-select-desktop__message--error" [id]="errorId()">
      {{ errorText }}
    </p>
  } @else if (hint(); as hintText) {
    <p class="af-select-desktop__message af-select-desktop__message--hint" [id]="hintId()">
      {{ hintText }}
    </p>
  }
</div>
