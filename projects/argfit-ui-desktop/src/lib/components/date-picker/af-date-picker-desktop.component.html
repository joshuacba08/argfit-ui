<div class="af-date-picker-desktop__field">
  @if (label(); as labelText) {
    <label class="af-date-picker-desktop__label" [attr.for]="resolvedInputId()" [id]="labelId()">
      {{ labelText }}
      @if (required()) {
        <span class="af-date-picker-desktop__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="af-date-picker-desktop__control">
    <p-datepicker
      class="af-date-picker-desktop__picker"
      [inputId]="resolvedInputId()"
      [ngModel]="valueAsDate()"
      [ngModelOptions]="{ standalone: true }"
      [name]="name() ?? ''"
      [placeholder]="placeholder() ?? 'Selecciona una fecha'"
      [ariaLabelledBy]="ariaLabelledBy()"
      [ariaLabel]="ariaLabel()"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-invalid]="errorText() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [minDate]="minDate() ?? undefined"
      [maxDate]="maxDate() ?? undefined"
      [required]="required()"
      [disabled]="disabled()"
      [invalid]="!!errorText()"
      [size]="pickerSize()"
      [showIcon]="!readonly()"
      iconDisplay="input"
      [showOnFocus]="!readonly()"
      [readonlyInput]="true"
      [showButtonBar]="true"
      [showClear]="!required() && !readonly()"
      [fluid]="true"
      dateFormat="dd/mm/yy"
      inputStyleClass="af-date-picker-desktop__input"
      panelStyleClass="af-date-picker-desktop__overlay"
      [appendTo]="'body'"
      [unstyled]="true"
      (ngModelChange)="onModelChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  </div>

  @if (errorText(); as error) {
    <p class="af-date-picker-desktop__message af-date-picker-desktop__message--error" [id]="errorId()">{{ error }}</p>
  } @else if (helperText(); as helper) {
    <p class="af-date-picker-desktop__message af-date-picker-desktop__message--hint" [id]="hintId()">{{ helper }}</p>
  }
</div>
