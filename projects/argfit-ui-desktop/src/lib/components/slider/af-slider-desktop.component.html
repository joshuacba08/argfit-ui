<div class="af-slider-desktop__field">
  @if (label(); as labelText) {
    <div class="af-slider-desktop__header">
      <label class="af-slider-desktop__label" [attr.for]="resolvedInputId()" [id]="labelId()">
        {{ labelText }}
        @if (required()) {
          <span class="af-slider-desktop__required" aria-hidden="true">*</span>
        }
      </label>
      @if (valueDisplay() === 'inline') {
        <!-- aria-hidden: el propio input ya anuncia el valor, repetirlo lo duplicaría. -->
        <span class="af-slider-desktop__value" aria-hidden="true">{{ displayValue() }}</span>
      }
    </div>
  }

  <div
    class="af-slider-desktop__control"
    [style.--af-slider-progress]="progress() + '%'"
    [style.--af-slider-tick-step]="tickStep() + '%'"
  >
    <input
      class="af-slider-desktop__input"
      type="range"
      [id]="resolvedInputId()"
      [name]="name() ?? null"
      [value]="boundedValue()"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [disabled]="disabled() || readonly()"
      [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
      [attr.aria-labelledby]="label() ? labelId() : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-valuetext]="resolvedValueText()"
      [attr.aria-invalid]="errorText() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  </div>

  @if (marks().length > 0) {
    <div class="af-slider-desktop__marks" aria-hidden="true">
      @for (mark of marks(); track mark.value) {
        <span class="af-slider-desktop__mark" [style.left.%]="markOffset(mark)">
          {{ mark.label }}
        </span>
      }
    </div>
  }

  @if (errorText(); as error) {
    <p class="af-slider-desktop__message af-slider-desktop__message--error" [id]="errorId()">
      {{ error }}
    </p>
  } @else if (helperText(); as helper) {
    <p class="af-slider-desktop__message af-slider-desktop__message--hint" [id]="hintId()">
      {{ helper }}
    </p>
  }
</div>
