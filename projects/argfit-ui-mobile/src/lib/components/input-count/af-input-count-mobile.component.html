<div class="af-input-count-mobile__field">
  @if (label(); as labelText) {
    <label class="af-input-count-mobile__label" [attr.for]="resolvedInputId()">
      {{ labelText }}
      @if (required()) {
        <span class="af-input-count-mobile__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="af-input-count-mobile__control">
    <button
      type="button"
      class="af-input-count-mobile__button"
      data-action="decrement"
      [disabled]="!canDecrement()"
      [attr.aria-label]="'Disminuir ' + (label() ?? 'valor')"
      (click)="emitDecrement()"
    >
      <span aria-hidden="true">−</span>
    </button>

    <div class="af-input-count-mobile__value-shell">
      <input
        class="af-input-count-mobile__input"
        type="number"
        [id]="resolvedInputId()"
        [name]="name() ?? undefined"
        [value]="formattedValue()"
        [disabled]="disabled()"
        [readOnly]="readonly() || !allowManualInput()"
        [required]="required()"
        [attr.aria-invalid]="errorText() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        [attr.min]="min() ?? null"
        [attr.max]="max() ?? null"
        [attr.step]="step()"
        inputmode="decimal"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />

      @if (unit(); as unitText) {
        <span class="af-input-count-mobile__unit">{{ unitText }}</span>
      }
    </div>

    <button
      type="button"
      class="af-input-count-mobile__button"
      data-action="increment"
      [disabled]="!canIncrement()"
      [attr.aria-label]="'Incrementar ' + (label() ?? 'valor')"
      (click)="emitIncrement()"
    >
      <span aria-hidden="true">+</span>
    </button>
  </div>

  @if (errorText(); as error) {
    <p class="af-input-count-mobile__message af-input-count-mobile__message--error" [id]="errorId()">{{ error }}</p>
  } @else if (helperText(); as helper) {
    <p class="af-input-count-mobile__message af-input-count-mobile__message--hint" [id]="hintId()">{{ helper }}</p>
  }
</div>
