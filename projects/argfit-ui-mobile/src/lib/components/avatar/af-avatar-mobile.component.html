<ion-avatar class="af-avatar-mobile__shell" aria-hidden="true">
  @if (imageSrc(); as imageSrcValue) {
    <img class="af-avatar-mobile__image" [src]="imageSrcValue" [alt]="imageAlt() ?? accessibleLabel() ?? ''" />
  } @else if (resolvedInitials(); as initialsValue) {
    <span class="af-avatar-mobile__initials">{{ initialsValue }}</span>
  } @else {
    <af-icon class="af-avatar-mobile__icon" [name]="fallbackIcon()" [size]="iconSize()" decorative />
  }
</ion-avatar>
