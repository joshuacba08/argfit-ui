<fieldset class="af-fieldset-mobile__frame" [disabled]="disabled()">
  @if (legend()) {
    <legend class="af-fieldset-mobile__legend">{{ legend() }}</legend>
  }

  @if (description()) {
    <p class="af-fieldset-mobile__description">{{ description() }}</p>
  }

  <div class="af-fieldset-mobile__content">
    <ng-content />
  </div>
</fieldset>
