<label class="af-checkbox-mobile__row" [attr.for]="resolvedCheckboxId()">
  <input
    class="af-checkbox-mobile__input"
    type="checkbox"
    [id]="resolvedCheckboxId()"
    [checked]="checked()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.name]="name() ?? null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (change)="onChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  <span class="af-checkbox-mobile__box" aria-hidden="true"></span>
  <span class="af-checkbox-mobile__copy">
    @if (label(); as labelText) {
      <span class="af-checkbox-mobile__text">{{ labelText }}</span>
    }
    @if (error(); as errorText) {
      <span class="af-checkbox-mobile__message af-checkbox-mobile__message--error" [id]="errorId()">{{ errorText }}</span>
    } @else if (hint(); as hintText) {
      <span class="af-checkbox-mobile__message af-checkbox-mobile__message--hint" [id]="hintId()">{{ hintText }}</span>
    }
  </span>
</label>
