<div class="af-password-mobile__field">
  @if (label(); as labelText) {
    <label class="af-password-mobile__label" [attr.for]="resolvedInputId()">
      {{ labelText }}
      @if (required()) {
        <span class="af-password-mobile__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <ion-input
    class="af-password-mobile__input"
    [id]="resolvedInputId()"
    [type]="inputType()"
    [attr.type]="inputType()"
    [value]="value()"
    [attr.placeholder]="placeholder() ?? null"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [attr.name]="name() ?? null"
    [attr.autocomplete]="resolvedAutocomplete()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (ionInput)="onInput($event)"
    (ionFocus)="onFocus()"
    (ionBlur)="onBlur()"
  >
    <ion-input-password-toggle
      slot="end"
      showIcon="eye"
      hideIcon="eye-off"
      [attr.aria-label]="passwordVisible() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
      (click)="toggleVisibility()"
    />
  </ion-input>

  @if (error(); as errorText) {
    <p class="af-password-mobile__message af-password-mobile__message--error" [id]="errorId()">
      {{ errorText }}
    </p>
  } @else if (hint(); as hintText) {
    <p class="af-password-mobile__message af-password-mobile__message--hint" [id]="hintId()">
      {{ hintText }}
    </p>
  }
</div>
