<div class="af-select-mobile__field">
  <ion-select
    class="af-select-mobile__select"
    [id]="resolvedSelectId()"
    [value]="value()"
    [disabled]="disabled()"
    [name]="name() ?? undefined"
    [label]="renderedLabel()"
    labelPlacement="stacked"
    [placeholder]="placeholder() ?? undefined"
    fill="outline"
    interface="alert"
    [interfaceOptions]="interfaceOptions()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-label]="label() ? null : placeholder() ?? name() ?? null"
    (ionChange)="onChange($event)"
    (ionFocus)="onFocus()"
    (ionBlur)="onBlur()"
  >
    @for (option of options(); track option.value) {
      <ion-select-option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</ion-select-option>
    }
  </ion-select>

  @if (error(); as errorText) {
    <p class="af-select-mobile__message af-select-mobile__message--error" [id]="errorId()">{{ errorText }}</p>
  } @else if (hint(); as hintText) {
    <p class="af-select-mobile__message af-select-mobile__message--hint" [id]="hintId()">{{ hintText }}</p>
  }
</div>
