@if (isMobile()) {
  <af-password-mobile
    [value]="resolvedValue()"
    [label]="label()"
    [placeholder]="placeholder()"
    [hint]="hint()"
    [error]="error()"
    [size]="size()"
    [tone]="tone()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [autocomplete]="autocomplete()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
} @else {
  <af-password-desktop
    [value]="resolvedValue()"
    [label]="label()"
    [placeholder]="placeholder()"
    [hint]="hint()"
    [error]="error()"
    [size]="size()"
    [tone]="tone()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [autocomplete]="autocomplete()"
    [name]="name()"
    [inputId]="inputId()"
    [feedback]="feedback()"
    [revealLabel]="revealLabel()"
    [hideLabel]="hideLabel()"
    [promptLabel]="promptLabel()"
    [weakLabel]="weakLabel()"
    [mediumLabel]="mediumLabel()"
    [strongLabel]="strongLabel()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
}
