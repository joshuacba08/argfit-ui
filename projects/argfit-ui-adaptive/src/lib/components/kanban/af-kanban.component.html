@if (isMobile()) {
  <af-kanban-mobile
    [columns]="columns()"
    [cards]="cards()"
    [filters]="filters()"
    [activeFilter]="activeFilter()"
    [title]="title()"
    [ariaLabel]="ariaLabel()"
    [cardIdKey]="cardIdKey()"
    [columnIdKey]="columnIdKey()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [allowReorder]="allowReorder()"
    [allowCrossColumnMove]="allowCrossColumnMove()"
    [density]="density()"
    [emptyState]="emptyState()"
    [cardTemplate]="cardTemplate()"
    [columnHeaderTemplate]="columnHeaderTemplate()"
    [emptyTemplate]="emptyTemplate()"
    [cardFooterTemplate]="cardFooterTemplate()"
    (cardMove)="cardMove.emit($event)"
    (cardClick)="cardClick.emit($event)"
    (addCard)="addCard.emit($event)"
    (filterChange)="filterChange.emit($event)"
    (columnAction)="columnAction.emit($event)"
  />
} @else {
  <af-kanban-desktop
    [columns]="columns()"
    [cards]="cards()"
    [filters]="filters()"
    [activeFilter]="activeFilter()"
    [title]="title()"
    [ariaLabel]="ariaLabel()"
    [cardIdKey]="cardIdKey()"
    [columnIdKey]="columnIdKey()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [allowReorder]="allowReorder()"
    [allowCrossColumnMove]="allowCrossColumnMove()"
    [density]="density()"
    [emptyState]="emptyState()"
    [cardTemplate]="cardTemplate()"
    [columnHeaderTemplate]="columnHeaderTemplate()"
    [emptyTemplate]="emptyTemplate()"
    [cardFooterTemplate]="cardFooterTemplate()"
    (cardMove)="cardMove.emit($event)"
    (cardClick)="cardClick.emit($event)"
    (addCard)="addCard.emit($event)"
    (filterChange)="filterChange.emit($event)"
    (columnAction)="columnAction.emit($event)"
  />
}
