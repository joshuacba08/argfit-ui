@if (isMobile()) {
  <af-multi-select-mobile
    [open]="open()"
    [options]="resolvedOptions()"
    [selectedLabels]="selectedLabels()"
    [summaryText]="summaryText()"
    [label]="label()"
    [placeholder]="resolvedPlaceholder()"
    [searchable]="searchable()"
    [clearable]="clearable()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [required]="required()"
    [maxSelected]="maxSelected()"
    [selectionLimitText]="selectionLimitText()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [density]="density()"
    [searchValue]="searchValue()"
    [inputId]="inputId()"
    (toggleValue)="onToggleValue($event)"
    (searchChange)="onSearchValueChange($event)"
    (openChange)="onOpenChange($event)"
    (clear)="onClear()"
  />
} @else {
  <af-multi-select-desktop
    [open]="open()"
    [options]="resolvedOptions()"
    [selectedLabels]="selectedLabels()"
    [summaryText]="summaryText()"
    [label]="label()"
    [placeholder]="resolvedPlaceholder()"
    [searchable]="searchable()"
    [clearable]="clearable()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [required]="required()"
    [maxSelected]="maxSelected()"
    [selectionLimitText]="selectionLimitText()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [density]="density()"
    [searchValue]="searchValue()"
    [inputId]="inputId()"
    (toggleValue)="onToggleValue($event)"
    (searchChange)="onSearchValueChange($event)"
    (openChange)="onOpenChange($event)"
    (clear)="onClear()"
  />
}
