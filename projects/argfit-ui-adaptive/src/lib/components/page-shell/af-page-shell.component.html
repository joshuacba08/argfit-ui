<ng-template #brandContent><ng-content select="[afPageShellBrand]" /></ng-template>
<ng-template #actionsContent><ng-content select="[afPageShellActions]" /></ng-template>
<ng-template #userContent><ng-content select="[afPageShellUser]" /></ng-template>
<ng-template #footerContent><ng-content select="[afPageShellFooter]" /></ng-template>
<ng-template #mainContent><ng-content /></ng-template>

@if (isMobile()) {
  <af-page-shell-mobile
    [title]="title()"
    [subtitle]="subtitle()"
    [navItems]="navItems()"
    [mobileTabs]="mobileTabs()"
    [activeItem]="activeItem()"
    [activeTab]="activeTab()"
    [density]="density()"
    [variant]="variant()"
    [ariaLabel]="ariaLabel()"
    [brandTemplate]="brandContent"
    [actionsTemplate]="actionsContent"
    [userTemplate]="userContent"
    [footerTemplate]="footerContent"
    (tabSelected)="tabSelected.emit($event)"
  >
    <ng-container *ngTemplateOutlet="mainContent" />
  </af-page-shell-mobile>
} @else {
  <af-page-shell-desktop
    [title]="title()"
    [subtitle]="subtitle()"
    [navItems]="navItems()"
    [breadcrumbs]="breadcrumbs()"
    [activeItem]="activeItem()"
    [density]="density()"
    [variant]="variant()"
    [collapsible]="collapsible()"
    [collapsed]="collapsed()"
    [showSearch]="showSearch()"
    [searchPlaceholder]="searchPlaceholder()"
    [notificationCount]="notificationCount()"
    [userInitials]="userInitials()"
    [ariaLabel]="ariaLabel()"
    [brandTemplate]="brandContent"
    [actionsTemplate]="actionsContent"
    [userTemplate]="userContent"
    [footerTemplate]="footerContent"
    (navItemSelected)="navItemSelected.emit($event)"
    (breadcrumbSelected)="breadcrumbSelected.emit($event)"
    (collapsedChange)="collapsedChange.emit($event)"
    (searchChanged)="searchChanged.emit($event)"
  >
    <ng-container *ngTemplateOutlet="mainContent" />
  </af-page-shell-desktop>
}
