<ng-template #timelineActions>
  <ng-content select="[afTimelineActions]" />
</ng-template>

<ng-template #timelineEmpty>
  <ng-content select="[afTimelineEmpty]" />
</ng-template>

<ng-template #timelineLoading>
  <ng-content select="[afTimelineLoading]" />
</ng-template>

@if (isMobile()) {
  <af-timeline-mobile
    [items]="items()"
    [density]="density()"
    [loading]="loading()"
    [error]="error()"
    [emptyTitle]="emptyTitle()"
    [emptyDescription]="emptyDescription()"
    [ariaLabel]="ariaLabel()"
    [itemTemplate]="projectedItemTemplate()"
    [actionsTemplate]="projectedActionsTemplate()"
    [emptyTemplate]="projectedEmptyTemplate()"
    [loadingTemplate]="projectedLoadingTemplate()"
    (itemPressed)="itemPressed.emit($event)"
  />
} @else {
  <af-timeline-desktop
    [items]="items()"
    [density]="density()"
    [loading]="loading()"
    [error]="error()"
    [emptyTitle]="emptyTitle()"
    [emptyDescription]="emptyDescription()"
    [ariaLabel]="ariaLabel()"
    [itemTemplate]="projectedItemTemplate()"
    [actionsTemplate]="projectedActionsTemplate()"
    [emptyTemplate]="projectedEmptyTemplate()"
    [loadingTemplate]="projectedLoadingTemplate()"
    (itemPressed)="itemPressed.emit($event)"
  />
}
