@if (isMobile()) {
  <af-file-upload-mobile
    [label]="label()"
    [accept]="accept()"
    [multiple]="multiple()"
    [maxSizeBytes]="maxSizeBytes()"
    [maxFiles]="maxFiles()"
    [files]="files()"
    [progress]="progress()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [required]="required()"
    [disabled]="disabled()"
    [size]="size()"
    [density]="density()"
    [name]="name()"
    [inputId]="inputId()"
    [buttonLabel]="buttonLabel()"
    [dropLabel]="dropLabel()"
    [removeLabel]="removeLabel()"
    (filesChange)="filesChange.emit($event)"
    (fileRemoved)="fileRemoved.emit($event)"
  />
} @else {
  <af-file-upload-desktop
    [label]="label()"
    [accept]="accept()"
    [multiple]="multiple()"
    [maxSizeBytes]="maxSizeBytes()"
    [maxFiles]="maxFiles()"
    [files]="files()"
    [progress]="progress()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [required]="required()"
    [disabled]="disabled()"
    [size]="size()"
    [density]="density()"
    [name]="name()"
    [inputId]="inputId()"
    [buttonLabel]="buttonLabel()"
    [dropLabel]="dropLabel()"
    [removeLabel]="removeLabel()"
    (filesChange)="filesChange.emit($event)"
    (fileRemoved)="fileRemoved.emit($event)"
  />
}
