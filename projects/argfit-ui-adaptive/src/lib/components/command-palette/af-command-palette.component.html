@if (isMobile()) {
  <af-command-palette-mobile
    [open]="currentOpen()"
    [query]="currentQuery()"
    [groups]="groups()"
    [activeId]="activeId()"
    [placeholder]="placeholder()"
    [emptyText]="emptyText()"
    [loading]="loading()"
    [loadingText]="loadingText()"
    [errorText]="errorText()"
    [showTrigger]="showTrigger()"
    [shortcutLabel]="shortcutLabel()"
    [disabled]="disabled()"
    [ariaLabel]="ariaLabel()"
    [closeLabel]="closeLabel()"
    [focusRequest]="focusRequest()"
    [itemTemplate]="itemTemplate()"
    (openChange)="onOpenChange($event)"
    (queryInput)="onQueryInput($event)"
    (navigation)="onNavigation($event)"
    (activeChange)="onActiveChange($event)"
    (itemActivated)="onItemActivated($event)"
  />
} @else {
  <af-command-palette-desktop
    [open]="currentOpen()"
    [query]="currentQuery()"
    [groups]="groups()"
    [activeId]="activeId()"
    [placeholder]="placeholder()"
    [emptyText]="emptyText()"
    [loading]="loading()"
    [loadingText]="loadingText()"
    [errorText]="errorText()"
    [showTrigger]="showTrigger()"
    [shortcutLabel]="shortcutLabel()"
    [disabled]="disabled()"
    [ariaLabel]="ariaLabel()"
    [closeLabel]="closeLabel()"
    [focusRequest]="focusRequest()"
    [itemTemplate]="itemTemplate()"
    (openChange)="onOpenChange($event)"
    (queryInput)="onQueryInput($event)"
    (navigation)="onNavigation($event)"
    (activeChange)="onActiveChange($event)"
    (itemActivated)="onItemActivated($event)"
  />
}
