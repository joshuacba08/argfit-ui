@let config = palette.config();
@let labels = config.labels;

@if (isMobile()) {
  <af-command-palette-mobile
    [open]="palette.isOpen()"
    [query]="palette.query()"
    [groups]="groups()"
    [activeId]="palette.activeId()"
    [placeholder]="palette.placeholder()"
    [emptyText]="palette.emptyText()"
    [loading]="palette.loading()"
    [loadingText]="labels?.loadingText ?? 'Buscando...'"
    [showTrigger]="config.showTrigger !== false"
    [shortcutLabel]="palette.shortcutLabel()"
    [ariaLabel]="labels?.ariaLabel ?? 'Paleta de comandos'"
    [closeLabel]="labels?.closeLabel ?? 'Cerrar paleta'"
    [backLabel]="labels?.backLabel ?? 'Volver'"
    [retryLabel]="labels?.retryLabel ?? 'Reintentar'"
    [modes]="palette.modes()"
    [modeId]="palette.modeId()"
    [breadcrumbs]="palette.breadcrumbs()"
    [canGoBack]="palette.canGoBack()"
    [providerErrors]="palette.providerErrors()"
    [validationText]="palette.validationText()"
    [focusRequest]="palette.focusRequest()"
    [resultTemplate]="resultTemplate()"
    [entityTemplate]="entityTemplate()"
    (openChange)="onOpenChange($event)"
    (queryInput)="palette.setQuery($event)"
    (navigation)="palette.navigate($event)"
    (activeChange)="palette.setActive($event)"
    (resultActivated)="palette.activate($event)"
    (modeChange)="palette.setMode($event)"
    (modeReset)="palette.resetMode()"
    (back)="palette.back()"
    (retryProvider)="palette.retryProvider($event)"
  />
} @else {
  <af-command-palette-desktop
    [open]="palette.isOpen()"
    [query]="palette.query()"
    [groups]="groups()"
    [activeId]="palette.activeId()"
    [placeholder]="palette.placeholder()"
    [emptyText]="palette.emptyText()"
    [loading]="palette.loading()"
    [loadingText]="labels?.loadingText ?? 'Buscando...'"
    [showTrigger]="config.showTrigger !== false"
    [shortcutLabel]="palette.shortcutLabel()"
    [ariaLabel]="labels?.ariaLabel ?? 'Paleta de comandos'"
    [closeLabel]="labels?.closeLabel ?? 'Cerrar paleta'"
    [backLabel]="labels?.backLabel ?? 'Volver'"
    [retryLabel]="labels?.retryLabel ?? 'Reintentar'"
    [modes]="palette.modes()"
    [modeId]="palette.modeId()"
    [breadcrumbs]="palette.breadcrumbs()"
    [canGoBack]="palette.canGoBack()"
    [providerErrors]="palette.providerErrors()"
    [validationText]="palette.validationText()"
    [focusRequest]="palette.focusRequest()"
    [resultTemplate]="resultTemplate()"
    [entityTemplate]="entityTemplate()"
    (openChange)="onOpenChange($event)"
    (queryInput)="palette.setQuery($event)"
    (navigation)="palette.navigate($event)"
    (activeChange)="palette.setActive($event)"
    (resultActivated)="palette.activate($event)"
    (modeChange)="palette.setMode($event)"
    (modeReset)="palette.resetMode()"
    (back)="palette.back()"
    (retryProvider)="palette.retryProvider($event)"
  />
}
