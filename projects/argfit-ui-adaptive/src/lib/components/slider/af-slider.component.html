@if (isMobile()) {
  <af-slider-mobile
    [label]="label()"
    [value]="resolvedValue()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [unit]="unit()"
    [marks]="marks()"
    [valueDisplay]="valueDisplay()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [size]="size()"
    [density]="density()"
    [name]="name()"
    [inputId]="inputId()"
    [ariaLabel]="ariaLabel()"
    [ariaValueText]="ariaValueText()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
} @else {
  <af-slider-desktop
    [label]="label()"
    [value]="resolvedValue()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [unit]="unit()"
    [marks]="marks()"
    [valueDisplay]="valueDisplay()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [size]="size()"
    [density]="density()"
    [name]="name()"
    [inputId]="inputId()"
    [ariaLabel]="ariaLabel()"
    [ariaValueText]="ariaValueText()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
}
