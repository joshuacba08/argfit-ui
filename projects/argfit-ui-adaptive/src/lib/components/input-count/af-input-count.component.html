@if (isMobile()) {
  <af-input-count-mobile
    [label]="label()"
    [value]="resolvedValue()"
    [unit]="unit()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [precision]="precision()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [required]="required()"
    [allowManualInput]="allowManualInput()"
    [size]="size()"
    [density]="density()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (increment)="onInternalIncrement($event)"
    (decrement)="onInternalDecrement($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
} @else {
  <af-input-count-desktop
    [label]="label()"
    [value]="resolvedValue()"
    [unit]="unit()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [precision]="precision()"
    [helperText]="helperText()"
    [errorText]="errorText()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [required]="required()"
    [allowManualInput]="allowManualInput()"
    [size]="size()"
    [density]="density()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (increment)="onInternalIncrement($event)"
    (decrement)="onInternalDecrement($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
}
