@if (isMobile()) {
  <af-input-mobile
    [value]="resolvedValue()"
    [label]="label()"
    [placeholder]="placeholder()"
    [hint]="hint()"
    [error]="error()"
    [type]="type()"
    [size]="size()"
    [tone]="tone()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [prefix]="prefix()"
    [suffix]="suffix()"
    [prefixIcon]="prefixIcon()"
    [autocomplete]="autocomplete()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
} @else {
  <af-input-desktop
    [value]="resolvedValue()"
    [label]="label()"
    [placeholder]="placeholder()"
    [hint]="hint()"
    [error]="error()"
    [type]="type()"
    [size]="size()"
    [tone]="tone()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [readonly]="readonly()"
    [prefix]="prefix()"
    [suffix]="suffix()"
    [prefixIcon]="prefixIcon()"
    [autocomplete]="autocomplete()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
  />
}
