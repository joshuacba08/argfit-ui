<ng-template #treeActions>
  <ng-content select="[afTreeActions]" />
</ng-template>

<ng-template #treeEmpty>
  <ng-content select="[afTreeEmpty]" />
</ng-template>

<ng-template #treeLoading>
  <ng-content select="[afTreeLoading]" />
</ng-template>

@if (isMobile()) {
  <af-tree-mobile
    [nodes]="nodes()"
    [selectedIds]="selectedIds()"
    [expandedIds]="expandedIds()"
    [selectionMode]="selectionMode()"
    [density]="density()"
    [disabled]="disabled()"
    [loading]="loading()"
    [error]="error()"
    [emptyTitle]="emptyTitle()"
    [emptyDescription]="emptyDescription()"
    [ariaLabel]="ariaLabel()"
    [nodeTemplate]="projectedNodeTemplate()"
    [actionsTemplate]="projectedActionsTemplate()"
    [emptyTemplate]="projectedEmptyTemplate()"
    [loadingTemplate]="projectedLoadingTemplate()"
    (selectionChange)="selectionChange.emit($event)"
    (expandedChange)="expandedChange.emit($event)"
    (nodePressed)="nodePressed.emit($event)"
  />
} @else {
  <af-tree-desktop
    [nodes]="nodes()"
    [selectedIds]="selectedIds()"
    [expandedIds]="expandedIds()"
    [selectionMode]="selectionMode()"
    [density]="density()"
    [disabled]="disabled()"
    [loading]="loading()"
    [error]="error()"
    [emptyTitle]="emptyTitle()"
    [emptyDescription]="emptyDescription()"
    [ariaLabel]="ariaLabel()"
    [nodeTemplate]="projectedNodeTemplate()"
    [actionsTemplate]="projectedActionsTemplate()"
    [emptyTemplate]="projectedEmptyTemplate()"
    [loadingTemplate]="projectedLoadingTemplate()"
    (selectionChange)="selectionChange.emit($event)"
    (expandedChange)="expandedChange.emit($event)"
    (nodePressed)="nodePressed.emit($event)"
  />
}
