@if (isMobile()) {
  <af-select-mobile
    [value]="resolvedValue()"
    [options]="options()"
    [label]="label()"
    [placeholder]="placeholder()"
    [hint]="hint()"
    [searchable]="searchable()"
    [searchPlaceholder]="searchPlaceholder()"
    [searchEmptyText]="searchEmptyText()"
    [searchMode]="searchMode()"
    [loading]="loading()"
    [loadingMore]="loadingMore()"
    [scrollLoad]="scrollLoad()"
    [hasMore]="hasMore()"
    [scrollThreshold]="scrollThreshold()"
    [debounceTime]="debounceTime()"
    [selectedOption]="selectedOption()"
    [error]="error()"
    [state]="state()"
    [size]="size()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
    (searchChange)="searchChange.emit($event)"
    (loadMore)="loadMore.emit($event)"
    (clearSearch)="clearSearch.emit()"
  />
} @else {
  <af-select-desktop
    [value]="resolvedValue()"
    [options]="options()"
    [label]="label()"
    [placeholder]="placeholder()"
    [hint]="hint()"
    [searchable]="searchable()"
    [searchPlaceholder]="searchPlaceholder()"
    [searchEmptyText]="searchEmptyText()"
    [searchMode]="searchMode()"
    [loading]="loading()"
    [loadingMore]="loadingMore()"
    [scrollLoad]="scrollLoad()"
    [hasMore]="hasMore()"
    [scrollThreshold]="scrollThreshold()"
    [debounceTime]="debounceTime()"
    [selectedOption]="selectedOption()"
    [error]="error()"
    [state]="state()"
    [size]="size()"
    [required]="required()"
    [disabled]="resolvedDisabled()"
    [name]="name()"
    [inputId]="inputId()"
    (valueChange)="onInternalValueChange($event)"
    (focusChange)="onInternalFocusChange($event)"
    (searchChange)="searchChange.emit($event)"
    (loadMore)="loadMore.emit($event)"
    (clearSearch)="clearSearch.emit()"
  />
}
