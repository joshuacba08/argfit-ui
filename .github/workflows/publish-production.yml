name: Publish Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Production tag to publish
        required: true
        default: v1.5.0
      publish_confirmation:
        description: Type publish-production-v1.5.0 to continue
        required: true
  push:
    tags:
      - 'v1.*.*'

permissions:
  contents: read

concurrency:
  group: production-publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-production:
    name: Publish production packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            expected_confirmation="publish-production-${{ inputs.release_tag }}"
            if [ "${{ inputs.publish_confirmation }}" != "$expected_confirmation" ]; then
              echo "Invalid publish confirmation. Expected $expected_confirmation"
              exit 1
            fi
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production publishes require a stable v1.x.y tag. Received: $release_tag"
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Missing tag $release_tag in the checked out repository."
            exit 1
          fi

          head_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "$head_tag" != "$release_tag" ]; then
            echo "Checked out revision is not exactly tagged as $release_tag."
            echo "Current exact tag: ${head_tag:-<none>}"
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate production release gate
        run: pnpm release:production:check

      - name: Rebuild production packages
        run: pnpm build:packages

      - name: Validate production package metadata
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');

          const expectedVersion = process.env.PACKAGE_VERSION;
          const packageDirectories = [
            'dist/argfit-ui-core',
            'dist/argfit-ui-primitives',
            'dist/argfit-ui-desktop',
            'dist/argfit-ui-mobile',
            'dist/argfit-ui-adaptive',
            'dist/argfit-ui-mcp',
          ];

          for (const packageDirectory of packageDirectories) {
            const manifest = JSON.parse(readFileSync(join(packageDirectory, 'package.json'), 'utf8'));

            if (manifest.version !== expectedVersion) {
              throw new Error(`${manifest.name} must be version ${expectedVersion}, found ${manifest.version}.`);
            }

            if (manifest.version.includes('-')) {
              throw new Error(`${manifest.name} must not publish a prerelease version through production workflow.`);
            }

            if (manifest.publishConfig?.access !== 'public') {
              throw new Error(`${manifest.name} publishConfig.access must be public.`);
            }

            if (manifest.publishConfig?.tag !== 'latest') {
              throw new Error(`${manifest.name} publishConfig.tag must be latest.`);
            }

            const peerDependencies = manifest.peerDependencies ?? {};
            for (const [peerName, peerVersion] of Object.entries(peerDependencies)) {
              if (peerName.startsWith('@argfit-ui/') && peerVersion !== expectedVersion) {
                throw new Error(`${manifest.name} peer ${peerName} must be ${expectedVersion}, found ${peerVersion}.`);
              }
            }
          }
          NODE

      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing. Configure it as a GitHub Actions secret, not as a variable."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish production packages
        shell: bash
        run: |
          package_dirs=(
            dist/argfit-ui-core
            dist/argfit-ui-primitives
            dist/argfit-ui-desktop
            dist/argfit-ui-mobile
            dist/argfit-ui-adaptive
            dist/argfit-ui-mcp
          )

          echo "Publishing ${#package_dirs[@]} production packages from ${{ steps.release.outputs.release_tag }}"
          for package_dir in "${package_dirs[@]}"; do
            npm publish "./$package_dir" --tag latest --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
