name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-beta-check:
    name: Beta release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run beta release gate
        run: pnpm release:beta:check

      - name: Upload beta tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-tarballs
          path: dist/beta-tarballs/*.tgz
          if-no-files-found: ignore

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-visual-smoke
          path: .tmp/visual-regression/current/*.png
          if-no-files-found: ignore
