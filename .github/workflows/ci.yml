name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-alpha-check:
    name: Alpha release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run alpha release gate
        run: pnpm release:alpha:check

      - name: Upload alpha tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-tarballs
          path: dist/alpha-tarballs/*.tgz
          if-no-files-found: ignore
