name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-production-check:
    name: Production release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production release gate
        run: pnpm release:production:check

      - name: Upload production tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-tarballs
          path: dist/production-tarballs/*.tgz
          if-no-files-found: ignore

      - name: Upload production visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-plus-visual-smoke
          path: .tmp/visual-regression/beta-plus/*.png
          if-no-files-found: ignore
