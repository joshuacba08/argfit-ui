name: Publish Beta Plus

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Beta+ tag to publish
        required: true
        default: v0.2.0-beta.0
      publish_confirmation:
        description: Type publish-beta-plus-v0.2.0-beta.0 to continue
        required: true
  push:
    tags:
      - 'v0.2.0-beta.*'

permissions:
  contents: read

concurrency:
  group: beta-plus-publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-beta-plus:
    name: Publish Beta+ packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${{ inputs.publish_confirmation }}" != "publish-beta-plus-v0.2.0-beta.0" ]; then
              echo "Invalid publish confirmation. Expected publish-beta-plus-v0.2.0-beta.0"
              exit 1
            fi
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [ "$release_tag" != "v0.2.0-beta.0" ]; then
            echo "This workflow only publishes v0.2.0-beta.0. Received: $release_tag"
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Missing tag $release_tag in the checked out repository."
            exit 1
          fi

          head_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "$head_tag" != "$release_tag" ]; then
            echo "Checked out revision is not exactly tagged as $release_tag."
            echo "Current exact tag: ${head_tag:-<none>}"
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate release gate
        run: pnpm release:beta-plus:check

      - name: Pack public tarballs
        run: pnpm pack:beta-plus

      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing. Configure it as a GitHub Actions secret, not as a variable."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Beta+ tarballs
        run: |
          shopt -s nullglob
          files=(dist/beta-plus-tarballs/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Beta+ tarballs were generated."
            exit 1
          fi
          echo "Publishing ${#files[@]} tarballs from ${{ steps.release.outputs.release_tag }}"
          for file in "${files[@]}"; do
            npm publish "$file" --tag beta --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
