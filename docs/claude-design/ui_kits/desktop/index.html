<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArgFit — Desktop UI Kit (PrimeNG)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Zalando Sans Expanded ── */
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-Light.ttf') format('truetype'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Zalando Sans Expanded'; src: url('../../uploads/ZalandoSans_Expanded-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; font-display: swap; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      background: #0A1628;
      font-family: 'Outfit', system-ui, sans-serif;
      color: #F0F4F8;
      -webkit-font-smoothing: antialiased;
    }
    .app-shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .main-content {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 60% at 70% 10%, rgba(37,153,213,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 10% 90%, rgba(0,212,255,0.04) 0%, transparent 50%),
        radial-gradient(ellipse 40% 40% at 90% 80%, rgba(37,153,213,0.03) 0%, transparent 50%);
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334E68; border-radius: 999px; }
    /* Transitions */
    .screen-enter { animation: fadeSlide 250ms ease-out; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    button { transition: transform 100ms ease, opacity 100ms; }
    button:active { transform: scale(0.97); }
    /* Table hover row highlight */
    tr { transition: background 80ms; }
    /* Range slider accent */
    input[type="range"] { height: 4px; }
    input[type="range"]::-webkit-slider-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2599D5; border: 2px solid #0F1D32; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="forms.jsx"></script>
  <script type="text/babel" src="overlays.jsx"></script>
  <script type="text/babel" src="kanban.jsx"></script>
  <script type="text/babel" src="advanced-table.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>

  <script type="text/babel">
    const {useState, useContext} = React;

    const screenTitles = {
      dashboard: 'Dashboard',
      athletes: 'Atletas',
      advancedTable: 'Tabla avanzada',
      kanban: 'Kanban — Rutinas',
      charts: 'Analytics',
      devices: 'Dispositivos',
      reports: 'Reportes',
      overlays: 'Overlays',
      forms: 'Formularios',
      settings: 'Configuración',
    };

    const breadcrumbs = {
      dashboard: ['ArgFit', 'Dashboard'],
      athletes: ['ArgFit', 'Atletas'],
      advancedTable: ['ArgFit', 'Tabla avanzada'],
      kanban: ['ArgFit', 'Kanban'],
      charts: ['ArgFit', 'Analytics'],
      devices: ['ArgFit', 'Dispositivos'],
      reports: ['ArgFit', 'Reportes'],
      overlays: ['ArgFit', 'Overlays'],
      forms: ['ArgFit', 'Formularios'],
      settings: ['ArgFit', 'Configuración'],
    };

    /* Extended sidebar icons */
    const DIExtra = {
      kanban: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="8" rx="1"/></svg>,
      table: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>,
      overlays: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>,
      charts: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 118 2.83"/><path d="M22 12A10 10 0 0012 2v10z"/></svg>,
    };

    function DesktopAppInner() {
      const [screen, setScreen] = useState('dashboard');
      const [collapsed, setCollapsed] = useState(false);

      /* Extended sidebar items */
      const sidebarItems = [
        {id:'dashboard',icon:DI.dashboard,label:'Dashboard'},
        {id:'athletes',icon:DI.users,label:'Atletas'},
        {id:'advancedTable',icon:DIExtra.table,label:'Tabla avanzada'},
        {id:'kanban',icon:DIExtra.kanban,label:'Kanban'},
        {id:'charts',icon:DIExtra.charts,label:'Analytics'},
        {id:'devices',icon:DI.device,label:'Dispositivos'},
        {id:'reports',icon:DI.report,label:'Reportes'},
        {id:'overlays',icon:DIExtra.overlays,label:'Overlays'},
        {id:'forms',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>,label:'Formularios'},
        {id:'settings',icon:DI.settings,label:'Configuración'},
      ];

      const screenMap = {
        dashboard: <DashboardScreen />,
        athletes: <AthletesScreen />,
        advancedTable: <AdvancedTableScreen />,
        kanban: <KanbanScreen />,
        charts: <ChartsScreen />,
        devices: <DevicesScreen />,
        reports: <ReportsScreen />,
        overlays: <OverlaysScreen />,
        forms: <FormsScreen />,
        settings: <SettingsScreen />,
      };

      return (
        <div className="app-shell">
          <Sidebar active={screen} onNavigate={setScreen} collapsed={collapsed} onToggle={()=>setCollapsed(!collapsed)} items={sidebarItems} />
          <div className="main-area">
            <TopBar title={screenTitles[screen]} breadcrumb={breadcrumbs[screen]} />
            <div className="main-content">
              <div className="screen-enter" key={screen}>
                {screenMap[screen]}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function DesktopApp() {
      return (
        <ToastProvider>
          <DesktopAppInner />
        </ToastProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DesktopApp />);
  </script>
</body>
</html>
