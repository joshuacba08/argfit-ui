<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.badge-primary{background:rgba(37,153,213,0.15);color:#57B0E7}
.badge-accent{background:rgba(0,212,255,0.12);color:#4DD4FF}
.badge-success{background:rgba(0,200,83,0.15);color:#00C853}
.badge-warning{background:rgba(255,179,0,0.15);color:#FFB300}
.badge-error{background:rgba(255,61,113,0.15);color:#FF3D71}
.badge-neutral{background:rgba(130,154,177,0.15);color:#9FB3C8}
.badge-solid{background:#2599D5;color:#fff}
.badge-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;background:#152A42;color:#BCCCDC;border:1px solid rgba(37,153,213,0.10)}

</style></head><body>
<div class="col" style="gap:12px">
  <div class="row" style="gap:8px;align-items:center">
    <span class="badge badge-primary">Primary</span>
    <span class="badge badge-accent">Accent</span>
    <span class="badge badge-success badge-dot">Connected</span>
    <span class="badge badge-warning badge-dot">Low Battery</span>
    <span class="badge badge-error badge-dot">Disconnected</span>
    <span class="badge badge-neutral">v2.4.1</span>
    <span class="badge badge-solid">PRO</span>
  </div>
  <div class="row" style="gap:8px;align-items:center">
    <span class="tag">Fuerza</span>
    <span class="tag">Velocidad</span>
    <span class="tag">Salto</span>
    <span class="tag" style="border-color:#2599D5;color:#2599D5">+ Agregar</span>
  </div>
</div>
</body></html>
