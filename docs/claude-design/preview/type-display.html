<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

.display{font-family:'Exo 2',system-ui,sans-serif;text-transform:uppercase;letter-spacing:-0.02em;color:#F0F4F8}

</style></head><body>
<div class="col" style="gap:10px">
  <div style="display:flex;align-items:baseline;gap:16px">
    <span class="display" style="font-size:48px;font-weight:800;line-height:1.1">H1 HEADING</span>
    <span class="label">48px / 800 / Zalando Sans Expanded</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span class="display" style="font-size:40px;font-weight:700;line-height:1.15">H2 HEADING</span>
    <span class="label">40px / 700</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span class="display" style="font-size:32px;font-weight:700;line-height:1.2">H3 Heading</span>
    <span class="label">32px / 700</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span class="display" style="font-size:24px;font-weight:700;line-height:1.25">H4 Heading</span>
    <span class="label">24px / 700</span>
  </div>
</div>
</body></html>
