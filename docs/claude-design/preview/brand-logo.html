<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

</style></head><body>
<div class="row" style="gap:32px;align-items:center">
  <div class="col" style="align-items:center;gap:8px">
    <div style="background:#0F1D32;border:1px solid rgba(37,153,213,0.10);border-radius:12px;padding:20px 28px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/logo-icon-dark.png" style="height:64px;object-fit:contain">
    </div>
    <span class="label">Icon (Dark BG)</span>
  </div>
  <div class="col" style="align-items:center;gap:8px">
    <div style="background:#F0F4F8;border-radius:12px;padding:20px 28px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/logo-wordmark.png" style="height:40px;object-fit:contain">
    </div>
    <span class="label">Wordmark (Light BG)</span>
  </div>
  <div class="col" style="gap:4px">
    <span class="label">Brand Colors</span>
    <div class="row" style="gap:6px">
      <div style="width:36px;height:36px;border-radius:8px;background:#2599D5"></div>
      <div style="width:36px;height:36px;border-radius:8px;background:#00D4FF"></div>
      <div style="width:36px;height:36px;border-radius:8px;background:#0A1628;border:1px solid rgba(37,153,213,0.2)"></div>
      <div style="width:36px;height:36px;border-radius:8px;background:#9FB3C8"></div>
    </div>
  </div>
</div>
</body></html>
