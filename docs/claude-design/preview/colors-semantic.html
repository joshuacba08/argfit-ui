<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

</style></head><body>
<div class="row" style="gap:20px">
<div class="col" style="gap:8px;align-items:center">
  <div class="label">Success</div>
  <div class="row" style="gap:6px">
    <div class="swatch" style="width:42px;height:36px;background:#B9F6CA"></div>
    <div class="swatch" style="width:42px;height:36px;background:#00C853"></div>
    <div class="swatch" style="width:42px;height:36px;background:#009624"></div>
  </div>
  <div class="val">#00C853</div>
</div><div class="col" style="gap:8px;align-items:center">
  <div class="label">Warning</div>
  <div class="row" style="gap:6px">
    <div class="swatch" style="width:42px;height:36px;background:#FFE082"></div>
    <div class="swatch" style="width:42px;height:36px;background:#FFB300"></div>
    <div class="swatch" style="width:42px;height:36px;background:#FF8F00"></div>
  </div>
  <div class="val">#FFB300</div>
</div><div class="col" style="gap:8px;align-items:center">
  <div class="label">Error</div>
  <div class="row" style="gap:6px">
    <div class="swatch" style="width:42px;height:36px;background:#FF8A9B"></div>
    <div class="swatch" style="width:42px;height:36px;background:#FF3D71"></div>
    <div class="swatch" style="width:42px;height:36px;background:#DB2C66"></div>
  </div>
  <div class="val">#FF3D71</div>
</div><div class="col" style="gap:8px;align-items:center">
  <div class="label">Info</div>
  <div class="row" style="gap:6px">
    <div class="swatch" style="width:42px;height:36px;background:#8DCAEF"></div>
    <div class="swatch" style="width:42px;height:36px;background:#2599D5"></div>
    <div class="swatch" style="width:42px;height:36px;background:#17618D"></div>
  </div>
  <div class="val">#2599D5</div>
</div>
</div>
</body></html>
