<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

.nav-bottom{display:flex;background:#0F1D32;border-radius:16px;padding:8px 12px;gap:4px;border:1px solid rgba(37,153,213,0.08)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;font-size:10px;color:#627D98;cursor:pointer;transition:all 200ms}
.nav-item.active{color:#2599D5;background:rgba(37,153,213,0.08)}
.nav-icon{font-size:20px;line-height:1}
.sidebar{display:flex;flex-direction:column;background:#0F1D32;border-radius:12px;padding:12px;gap:2px;border:1px solid rgba(37,153,213,0.08);min-width:180px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;color:#829AB1;cursor:pointer;transition:all 150ms;font-weight:500}
.sidebar-item.active{background:rgba(37,153,213,0.12);color:#2599D5}

</style></head><body>
<div class="row" style="gap:24px;align-items:flex-start">
  <div style="width:320px">
    <div class="label" style="margin-bottom:8px">Mobile — Bottom Tabs (Ionic)</div>
    <div class="nav-bottom">
      <div class="nav-item active"><span class="nav-icon">⌂</span>Home</div>
      <div class="nav-item"><span class="nav-icon">◎</span>Devices</div>
      <div class="nav-item"><span class="nav-icon">▶</span>Train</div>
      <div class="nav-item"><span class="nav-icon">📊</span>Stats</div>
      <div class="nav-item"><span class="nav-icon">⚙</span>Settings</div>
    </div>
  </div>
  <div>
    <div class="label" style="margin-bottom:8px">Desktop — Sidebar (PrimeNG)</div>
    <div class="sidebar">
      <div class="sidebar-item active">⌂ &nbsp;Dashboard</div>
      <div class="sidebar-item">◎ &nbsp;Dispositivos</div>
      <div class="sidebar-item">👤 &nbsp;Atletas</div>
      <div class="sidebar-item">📊 &nbsp;Reportes</div>
      <div class="sidebar-item">⚙ &nbsp;Configuración</div>
    </div>
  </div>
</div>
</body></html>
