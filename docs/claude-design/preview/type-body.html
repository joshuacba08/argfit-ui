<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

.mono{font-family:'JetBrains Mono',monospace}

</style></head><body>
<div class="col" style="gap:12px">
  <div style="display:flex;align-items:baseline;gap:16px">
    <span style="font-size:18px;font-weight:400;color:#F0F4F8">Body XL — Performance data in real time</span>
    <span class="label">18px / 400 / Outfit</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span style="font-size:16px;font-weight:400;color:#BCCCDC">Body — Sensor readings updated every millisecond</span>
    <span class="label">16px / 400</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span style="font-size:14px;font-weight:500;color:#9FB3C8">Body SM — 40+ institutions across 6 countries</span>
    <span class="label">14px / 500</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span style="font-size:12px;font-weight:400;color:#829AB1">Caption — Last synced 2 min ago</span>
    <span class="label">12px / 400</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px">
    <span class="mono" style="font-size:14px;color:#00D4FF">0.342s  |  45.2cm  |  2847N</span>
    <span class="label">14px / Mono</span>
  </div>
</div>
</body></html>
