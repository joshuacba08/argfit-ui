<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

</style></head><body>
<div class="row" style="gap:16px">
<div class="col" style="align-items:center;gap:8px">
  <div class="swatch" style="width:100px;height:56px;background:#0A1628;border:1px solid rgba(37,153,213,0.12);color:#829AB1;font-size:10px;align-items:flex-end">BG</div>
  <div class="val">#0A1628</div>
</div><div class="col" style="align-items:center;gap:8px">
  <div class="swatch" style="width:100px;height:56px;background:#0F1D32;border:1px solid rgba(37,153,213,0.12);color:#829AB1;font-size:10px;align-items:flex-end">Surface 1</div>
  <div class="val">#0F1D32</div>
</div><div class="col" style="align-items:center;gap:8px">
  <div class="swatch" style="width:100px;height:56px;background:#152A42;border:1px solid rgba(37,153,213,0.12);color:#829AB1;font-size:10px;align-items:flex-end">Surface 2</div>
  <div class="val">#152A42</div>
</div><div class="col" style="align-items:center;gap:8px">
  <div class="swatch" style="width:100px;height:56px;background:#1C3550;border:1px solid rgba(37,153,213,0.12);color:#829AB1;font-size:10px;align-items:flex-end">Surface 3</div>
  <div class="val">#1C3550</div>
</div><div class="col" style="align-items:center;gap:8px">
  <div class="swatch" style="width:100px;height:56px;background:#234060;border:1px solid rgba(37,153,213,0.12);color:#829AB1;font-size:10px;align-items:flex-end">Surface 4</div>
  <div class="val">#234060</div>
</div>
</div>
</body></html>
