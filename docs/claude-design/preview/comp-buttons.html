<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:all 200ms cubic-bezier(0.22,1,0.36,1);letter-spacing:0.02em}
.btn-primary{background:#2599D5;color:#fff;padding:10px 24px;border-radius:8px}
.btn-primary:hover{background:#57B0E7;box-shadow:0 0 24px rgba(37,153,213,0.25)}
.btn-accent{background:#00D4FF;color:#0A1628;padding:10px 24px;border-radius:8px}
.btn-outline{background:transparent;color:#2599D5;padding:9px 23px;border-radius:8px;border:1.5px solid rgba(37,153,213,0.3)}
.btn-ghost{background:transparent;color:#BCCCDC;padding:10px 24px;border-radius:8px}
.btn-pill{border-radius:999px}
.btn-sm{padding:6px 16px;font-size:12px}
.btn-lg{padding:14px 32px;font-size:16px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:8px;background:#152A42;color:#BCCCDC;border:1px solid rgba(37,153,213,0.12)}
.btn-danger{background:#FF3D71;color:#fff;padding:10px 24px;border-radius:8px}

</style></head><body>
<div class="col" style="gap:12px">
  <div class="row" style="gap:10px;align-items:center">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-accent">Accent</button>
    <button class="btn btn-outline">Outline</button>
    <button class="btn btn-ghost">Ghost</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-icon">✕</button>
  </div>
  <div class="row" style="gap:10px;align-items:center">
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
    <button class="btn btn-primary btn-pill">Pill Shape</button>
    <button class="btn btn-primary" style="opacity:0.4;pointer-events:none">Disabled</button>
  </div>
</div>
</body></html>
