<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1628;color:#F0F4F8;font-family:'Outfit',system-ui,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px}
.swatch{border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:500;letter-spacing:0.02em}
.label{font-size:11px;color:#829AB1;font-weight:500}
.val{font-size:11px;color:#BCCCDC;font-family:'JetBrains Mono',monospace}

.card{background:#0F1D32;border:1px solid rgba(37,153,213,0.10);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card-stat{text-align:center;min-width:120px}
.card-stat .stat-value{font-family:'Exo 2',sans-serif;font-size:32px;font-weight:800;color:#2599D5;letter-spacing:-0.02em}
.card-stat .stat-label{font-size:12px;color:#829AB1;margin-top:4px}
.card-device{flex-direction:row;gap:16px;align-items:center}
.device-dot{width:10px;height:10px;border-radius:50%;background:#00C853;box-shadow:0 0 8px rgba(0,200,83,0.4)}
.device-dot.off{background:#FF3D71;box-shadow:0 0 8px rgba(255,61,113,0.4)}
.chip{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(37,153,213,0.15);color:#57B0E7}

</style></head><body>
<div class="row" style="gap:16px">
  <div class="card card-stat"><div class="stat-value">45.2<span style="font-size:16px;color:#829AB1">cm</span></div><div class="stat-label">Jump Height</div></div>
  <div class="card card-stat"><div class="stat-value">2847<span style="font-size:16px;color:#829AB1">N</span></div><div class="stat-label">Peak Force</div></div>
  <div class="card card-stat"><div class="stat-value">0.34<span style="font-size:16px;color:#829AB1">s</span></div><div class="stat-label">Contact Time</div></div>
  <div class="card card-device" style="flex:1">
    <div class="device-dot"></div>
    <div class="col" style="gap:2px;flex:1"><span style="font-weight:600;font-size:14px">ArgFit Jump 2</span><span style="font-size:12px;color:#829AB1">Connected • Battery 87%</span></div>
    <div class="chip">BLE</div>
  </div>
</div>
</body></html>
